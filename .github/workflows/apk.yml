name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk PanelUA.apk
      - name: Publicar descarga (release «ultima»)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Panel UA para Android
          body: "Descarga: PanelUA.apk — se actualiza sola con cada cambio."
          files: PanelUA.apk
          make_latest: true
