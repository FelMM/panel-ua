plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.uchile.bachillerato.panelua'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.uchile.bachillerato.panelua'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firma con la clave de depuración para que el APK de "release" se pueda instalar directo.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
